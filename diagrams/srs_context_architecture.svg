<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1100" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="1080" height="400" rx="8" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>
  <rect x="10" y="10" width="1080" height="38" rx="8" fill="#18181b"/>
  <text x="28" y="34" fill="#ffffff" font-size="13.5" font-weight="700">ClubSphere System Context &amp; End-to-End Governance Flow (46 Clubs | ~320 Events/Year)</text>
  <text x="1070" y="34" fill="#a1a1aa" font-size="11" text-anchor="end">Target Turnaround: &lt;= 3 Days (-72.73%) | Target Venue Clashes: 0</text>

  <defs>
    <marker id="blkArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 9,5 0,9" fill="#18181b"/>
    </marker>
    <marker id="coralArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 9,5 0,9" fill="#dc4c3e"/>
    </marker>
  </defs>

  <!-- Left Stakeholders -->
  <g transform="translate(35, 72)">
    <rect width="200" height="72" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="200" height="22" rx="6" fill="#18181b"/>
    <text x="100" y="15" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">46 Student Club Leaders</text>
    <text x="100" y="40" fill="#27272a" font-size="10.5" text-anchor="middle">Submit proposals, budgets,</text>
    <text x="100" y="56" fill="#52525b" font-size="10" text-anchor="middle">receipts &amp; attendance CSVs</text>
  </g>

  <g transform="translate(35, 168)">
    <rect width="200" height="72" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="200" height="22" rx="6" fill="#3f3f46"/>
    <text x="100" y="15" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Faculty Coordinators (Tier 1)</text>
    <text x="100" y="40" fill="#27272a" font-size="10.5" text-anchor="middle">Endorse academic merit</text>
    <text x="100" y="56" fill="#52525b" font-size="10" text-anchor="middle">&amp; co-sign annual handover</text>
  </g>

  <g transform="translate(35, 264)">
    <rect width="200" height="72" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="200" height="22" rx="6" fill="#3f3f46"/>
    <text x="100" y="15" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Student Participants</text>
    <text x="100" y="40" fill="#27272a" font-size="10.5" text-anchor="middle">Attend events &amp; download</text>
    <text x="100" y="56" fill="#52525b" font-size="10" text-anchor="middle">QR-verified PDF certificates</text>
  </g>

  <!-- Central ClubSphere Core -->
  <rect x="305" y="68" width="490" height="318" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="2.2"/>
  <rect x="305" y="68" width="490" height="30" rx="10" fill="#18181b"/>
  <text x="550" y="88" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">ClubSphere Core Platform (React SPA + REST API + PostgreSQL)</text>

  <!-- 4 Core Subsystems inside Center -->
  <g transform="translate(325, 114)">
    <rect width="215" height="112" rx="6" fill="#f4f4f5" stroke="#27272a" stroke-width="1.5"/>
    <text x="107" y="20" fill="#18181b" font-size="11.5" font-weight="700" text-anchor="middle">1. Venue Booking Engine</text>
    <line x1="10" y1="28" x2="205" y2="28" stroke="#d4d4d8"/>
    <text x="14" y="46" fill="#27272a" font-size="10">• Real-time capacity validation</text>
    <text x="14" y="64" fill="#27272a" font-size="10">• Atomic SOFT_HOLD lock</text>
    <text x="14" y="82" fill="#27272a" font-size="10">• +30 min setup/teardown buffer</text>
    <text x="14" y="100" fill="#dc4c3e" font-size="10" font-weight="700">• Eliminates 17 clashes/year</text>
  </g>

  <g transform="translate(560, 114)">
    <rect width="215" height="112" rx="6" fill="#f4f4f5" stroke="#27272a" stroke-width="1.5"/>
    <text x="107" y="20" fill="#18181b" font-size="11.5" font-weight="700" text-anchor="middle">2. 3-Tier Approval Engine</text>
    <line x1="10" y1="28" x2="205" y2="28" stroke="#d4d4d8"/>
    <text x="14" y="46" fill="#27272a" font-size="10">• Tier 1 Faculty -&gt; Tier 2 Dean</text>
    <text x="14" y="64" fill="#27272a" font-size="10">• Tier 3 Security Desk clearance</text>
    <text x="14" y="82" fill="#27272a" font-size="10">• 16h/24h SLA auto-escalation</text>
    <text x="14" y="100" fill="#dc4c3e" font-size="10" font-weight="700">• Cuts approval 11d -&gt; &lt;= 3d</text>
  </g>

  <g transform="translate(325, 246)">
    <rect width="215" height="118" rx="6" fill="#f4f4f5" stroke="#27272a" stroke-width="1.5"/>
    <text x="107" y="20" fill="#18181b" font-size="11.5" font-weight="700" text-anchor="middle">3. Club Budget Ledger</text>
    <line x1="10" y1="28" x2="205" y2="28" stroke="#d4d4d8"/>
    <text x="14" y="46" fill="#27272a" font-size="10">• Replaces personal notebooks</text>
    <text x="14" y="64" fill="#27272a" font-size="10">• Auto-earmarks sanctioned funds</text>
    <text x="14" y="82" fill="#27272a" font-size="10">• 7-day post-event receipt gate</text>
    <text x="14" y="100" fill="#18181b" font-size="10" font-weight="700">• 5-year queryable retention</text>
  </g>

  <g transform="translate(560, 246)">
    <rect width="215" height="118" rx="6" fill="#f4f4f5" stroke="#27272a" stroke-width="1.5"/>
    <text x="107" y="20" fill="#18181b" font-size="11.5" font-weight="700" text-anchor="middle">4. Continuity &amp; Audit</text>
    <line x1="10" y1="28" x2="205" y2="28" stroke="#d4d4d8"/>
    <text x="14" y="46" fill="#27272a" font-size="10">• Annual Leadership Handover</text>
    <text x="14" y="64" fill="#27272a" font-size="10">• Bulk QR Certificate generator</text>
    <text x="14" y="82" fill="#27272a" font-size="10">• Append-only SHA-256 audit log</text>
    <text x="14" y="100" fill="#18181b" font-size="10" font-weight="700">• Junior Maintainer Runbooks</text>
  </g>

  <!-- Right Stakeholders -->
  <g transform="translate(865, 95)">
    <rect width="200" height="82" rx="6" fill="#ffffff" stroke="#dc4c3e" stroke-width="2"/>
    <rect width="200" height="22" rx="6" fill="#dc4c3e"/>
    <text x="100" y="15" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Dean of Student Affairs</text>
    <text x="100" y="40" fill="#27272a" font-size="10.5" text-anchor="middle">Tier-2 policy &amp; budget sanction;</text>
    <text x="100" y="56" fill="#27272a" font-size="10.5" text-anchor="middle">46-club financial audit;</text>
    <text x="100" y="71" fill="#52525b" font-size="10" text-anchor="middle">annual handover ratification</text>
  </g>

  <g transform="translate(865, 215)">
    <rect width="200" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="200" height="22" rx="6" fill="#18181b"/>
    <text x="100" y="15" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Campus Security Desk</text>
    <text x="100" y="40" fill="#27272a" font-size="10.5" text-anchor="middle">Tier-3 crowd safety clearance;</text>
    <text x="100" y="56" fill="#27272a" font-size="10.5" text-anchor="middle">triggers CONFIRMED venue lock;</text>
    <text x="100" y="71" fill="#52525b" font-size="10" text-anchor="middle">verifies gate pass &amp; headcount</text>
  </g>

  <!-- Arrows -->
  <line x1="235" y1="108" x2="302" y2="145" stroke="#18181b" stroke-width="1.8" marker-end="url(#blkArr)"/>
  <line x1="235" y1="204" x2="302" y2="204" stroke="#18181b" stroke-width="1.8" marker-end="url(#blkArr)"/>
  <line x1="235" y1="300" x2="302" y2="300" stroke="#18181b" stroke-width="1.8" marker-end="url(#blkArr)"/>
  <line x1="795" y1="150" x2="862" y2="136" stroke="#dc4c3e" stroke-width="1.8" marker-end="url(#coralArr)"/>
  <line x1="795" y1="245" x2="862" y2="256" stroke="#18181b" stroke-width="1.8" marker-end="url(#blkArr)"/>
</svg>