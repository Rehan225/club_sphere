<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="100%" height="100%" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowNav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#18181b" stroke-width="1.6"/>
    </marker>
    <marker id="arrowEvt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#dc4c3e" stroke-width="1.8"/>
    </marker>
    <marker id="diamondComp" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <polygon points="1,5 7,1 13,5 7,9" fill="#18181b" stroke="#18181b" stroke-width="1"/>
    </marker>
    <marker id="diamondAgg" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="9" markerHeight="7" orient="auto">
      <polygon points="1,5 7,1 13,5 7,9" fill="#ffffff" stroke="#18181b" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1180" height="800" fill="#ffffff"/>
  <rect x="12" y="10" width="1156" height="780" rx="8" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="12" y="10" width="1156" height="42" rx="8" fill="#18181b"/>
  <text x="32" y="36" fill="#ffffff" font-size="15" font-weight="700">UML Class Diagram — Cohesive Domain Modules &amp; Decoupled Event Port</text>
  <text x="1148" y="36" fill="#a1a1aa" font-size="11.5" text-anchor="end">Loose Coupling: ApprovalWorkflowEngine &lt;-&gt; IVenueBookingPort</text>

  <!-- Package 1 -->
  <rect x="24" y="66" width="358" height="710" rx="8" fill="#f4f4f5" fill-opacity="0.7" stroke="#71717a" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="36" y="86" fill="#18181b" font-size="11.5" font-weight="700">&lt;&lt;Package&gt;&gt; CoreProposal &amp; ClubGovernance</text>

  <!-- Package 2 -->
  <rect x="402" y="66" width="372" height="470" rx="8" fill="#fef2f2" fill-opacity="0.5" stroke="#dc4c3e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="416" y="86" fill="#dc4c3e" font-size="11.5" font-weight="700">&lt;&lt;Package&gt;&gt; ApprovalWorkflowModule (Cohesive)</text>

  <!-- Package 3 -->
  <rect x="794" y="66" width="360" height="470" rx="8" fill="#f4f4f5" fill-opacity="0.7" stroke="#18181b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="808" y="86" fill="#18181b" font-size="11.5" font-weight="700">&lt;&lt;Package&gt;&gt; VenueBookingModule (Cohesive)</text>

  <!-- Package 4 -->
  <rect x="402" y="552" width="752" height="224" rx="8" fill="#f4f4f5" fill-opacity="0.7" stroke="#71717a" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="416" y="572" fill="#18181b" font-size="11.5" font-weight="700">&lt;&lt;Package&gt;&gt; BudgetLedger &amp; CertificateModule</text>

  <!-- Class 1: Club -->
  <g transform="translate(38, 100)">
    <rect width="330" height="160" rx="5" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="330" height="26" rx="5" fill="#18181b"/>
    <text x="165" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Club</text>
    <line x1="0" y1="94" x2="330" y2="94" stroke="#d4d4d8"/>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="42">- clubId: UUID</text>
      <text x="10" y="57">- name: String</text>
      <text x="10" y="72">- currentLeaderId: UUID</text>
      <text x="10" y="87">- facultyCoordinatorId: UUID</text>
      <text x="10" y="111">+ proposeEvent(dto: ProposalDTO): EventProposal</text>
      <text x="10" y="127">+ transferLeadership(newId: UUID): HandoverRecord</text>
      <text x="10" y="143">+ getAnnualEventCount(year: String): int</text>
    </g>
  </g>

  <!-- Class 2: EventProposal -->
  <g transform="translate(38, 300)">
    <rect width="330" height="235" rx="5" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
    <rect width="330" height="26" rx="5" fill="#18181b"/>
    <text x="165" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">EventProposal (Aggregate Root)</text>
    <line x1="0" y1="140" x2="330" y2="140" stroke="#d4d4d8"/>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="42">- proposalId: UUID</text>
      <text x="10" y="57">- clubId: UUID</text>
      <text x="10" y="72">- title: String</text>
      <text x="10" y="87">- expectedAttendees: int [10..2000]</text>
      <text x="10" y="102">- requestedBudgetINR: Decimal [0..150000]</text>
      <text x="10" y="117">- state: ProposalState</text>
      <text x="10" y="132">- holdToken: HoldToken</text>
      <text x="10" y="157">+ submit(): void</text>
      <text x="10" y="173">+ transitionState(newState: ProposalState): void</text>
      <text x="10" y="189">+ requestRevision(notes: String): void</text>
      <text x="10" y="205">+ requiresDeanSanction(): boolean</text>
      <text x="10" y="221">+ cancelProposal(): void</text>
    </g>
  </g>

  <!-- Class 3: LeadershipHandover -->
  <g transform="translate(38, 575)">
    <rect width="330" height="180" rx="5" fill="#ffffff" stroke="#3f3f46" stroke-width="1.6"/>
    <rect width="330" height="26" rx="5" fill="#3f3f46"/>
    <text x="165" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">LeadershipHandover (FR-10)</text>
    <line x1="0" y1="108" x2="330" y2="108" stroke="#d4d4d8"/>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="42">- handoverId: UUID</text>
      <text x="10" y="57">- outgoingLeaderId: UUID</text>
      <text x="10" y="72">- incomingLeaderId: UUID</text>
      <text x="10" y="87">- academicYear: String</text>
      <text x="10" y="101">- ledgerVerifiedByFaculty: boolean</text>
      <text x="10" y="126">+ archivePreviousTerm(): void</text>
      <text x="10" y="142">+ revokeOutgoingWriteAccess(): void</text>
      <text x="10" y="158">+ bindIncomingLeaderRole(): void</text>
    </g>
  </g>

  <!-- Class 4: ApprovalWorkflowEngine -->
  <g transform="translate(418, 100)">
    <rect width="340" height="196" rx="5" fill="#ffffff" stroke="#dc4c3e" stroke-width="2"/>
    <rect width="340" height="26" rx="5" fill="#dc4c3e"/>
    <text x="170" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">ApprovalWorkflowEngine (FR-04..06)</text>
    <line x1="0" y1="95" x2="340" y2="95" stroke="#d4d4d8"/>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="42">- workflowId: UUID</text>
      <text x="10" y="57">- proposalId: UUID</text>
      <text x="10" y="72">- currentTier: Tier {FACULTY, DEAN, SECURITY}</text>
      <text x="10" y="87">- slaDeadline: Timestamp (+72h target)</text>
      <text x="10" y="112">+ initiateWorkflow(proposalId: UUID): void</text>
      <text x="10" y="128">+ recordDecision(actorId, tier, decision): void</text>
      <text x="10" y="144">+ evaluateTierRouting(budget, attendees): List</text>
      <text x="10" y="160">+ publishDomainEvent(evt: ApprovalEvent): void</text>
      <text x="10" y="176">+ escalateSlaBreach(): void</text>
    </g>
  </g>

  <!-- Class 5: ApprovalAuditEntry -->
  <g transform="translate(418, 330)">
    <rect width="340" height="186" rx="5" fill="#ffffff" stroke="#3f3f46" stroke-width="1.6"/>
    <rect width="340" height="26" rx="5" fill="#3f3f46"/>
    <text x="170" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">ApprovalAuditEntry (FR-11, NFR-03)</text>
    <line x1="0" y1="112" x2="340" y2="112" stroke="#d4d4d8"/>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="42">- auditId: UUID</text>
      <text x="10" y="57">- workflowId: UUID</text>
      <text x="10" y="72">- actorRole: Role</text>
      <text x="10" y="87">- decision: DecisionType</text>
      <text x="10" y="102">- prevHashSHA256: String</text>
      <text x="10" y="129">+ computeEntryHash(): String</text>
      <text x="10" y="145">+ verifyChainImmutability(): boolean</text>
      <text x="10" y="161">+ exportAuditTrailPDF(): File</text>
    </g>
  </g>

  <!-- Class 6: IVenueBookingPort -->
  <g transform="translate(808, 100)">
    <rect width="332" height="114" rx="5" fill="#fafafa" stroke="#18181b" stroke-width="1.8" stroke-dasharray="4,2"/>
    <rect width="332" height="26" rx="5" fill="#27272a"/>
    <text x="166" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">&lt;&lt;Interface&gt;&gt; IVenueBookingPort</text>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="46">+ placeSoftHold(venueId, slot, cap): HoldToken</text>
      <text x="10" y="64">+ confirmBooking(token: HoldToken): Booking</text>
      <text x="10" y="82">+ releaseHold(token: HoldToken): void</text>
      <text x="10" y="100">+ detectClash(venueId, start, end): ClashResult</text>
    </g>
  </g>

  <!-- Class 7: VenueSlotBooking -->
  <g transform="translate(808, 240)">
    <rect width="332" height="276" rx="5" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
    <rect width="332" height="26" rx="5" fill="#18181b"/>
    <text x="166" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">VenueSlotBooking (FR-02, FR-03)</text>
    <line x1="0" y1="146" x2="332" y2="146" stroke="#d4d4d8"/>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="42">- bookingId: UUID</text>
      <text x="10" y="57">- venueId: UUID</text>
      <text x="10" y="72">- certifiedCapacity: int</text>
      <text x="10" y="87">- startTime: Timestamp</text>
      <text x="10" y="102">- endTime: Timestamp</text>
      <text x="10" y="117">- bufferMinutes: int = 30</text>
      <text x="10" y="132">- status: SlotState {SOFT_HOLD, CONFIRMED, RELEASED}</text>
      <text x="10" y="164">+ hasIntervalOverlap(other: TimeRange): boolean</text>
      <text x="10" y="180">+ validateCapacity(attendees: int): boolean</text>
      <text x="10" y="196">+ acquireOptimisticLock(ver: long): boolean</text>
      <text x="10" y="212">+ onProposalApproved(evt: ApprovalEvent): void</text>
      <text x="10" y="228">+ onProposalRejected(evt: ApprovalEvent): void</text>
      <text x="10" y="244">+ suggestAlternateSlots(cap, slot): List</text>
    </g>
  </g>

  <!-- Class 8: BudgetLedger -->
  <g transform="translate(418, 584)">
    <rect width="340" height="176" rx="5" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="340" height="26" rx="5" fill="#18181b"/>
    <text x="170" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">BudgetLedger &amp; ExpenseItem (FR-07, FR-08)</text>
    <line x1="0" y1="104" x2="340" y2="104" stroke="#d4d4d8"/>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="42">- ledgerId: UUID</text>
      <text x="10" y="57">- allocatedAnnualBudget: Decimal</text>
      <text x="10" y="72">- earmarkedSanction: Decimal</text>
      <text x="10" y="87">- actualExpenditure: Decimal</text>
      <text x="10" y="121">+ earmarkFunds(proposalId, amt): boolean</text>
      <text x="10" y="137">+ uploadReceipt(item, fileUrl): void</text>
      <text x="10" y="153">+ computeVariance(): Decimal</text>
    </g>
  </g>

  <!-- Class 9: ParticipationCertificate -->
  <g transform="translate(808, 584)">
    <rect width="332" height="176" rx="5" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="332" height="26" rx="5" fill="#18181b"/>
    <text x="166" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">ParticipationCertificate (FR-09)</text>
    <line x1="0" y1="104" x2="332" y2="104" stroke="#d4d4d8"/>
    <g font-size="10.5" fill="#18181b" font-family="monospace">
      <text x="10" y="42">- certificateId: UUID</text>
      <text x="10" y="57">- eventId: UUID</text>
      <text x="10" y="72">- studentRollNo: String</text>
      <text x="10" y="87">- verificationQRHash: String</text>
      <text x="10" y="121">+ generateBatchPDF(csvRoster: File): List</text>
      <text x="10" y="137">+ signDigitalQR(): String</text>
      <text x="10" y="153">+ verifyHashPublic(hash: String): CertMeta</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="203" y1="260" x2="203" y2="300" stroke="#18181b" stroke-width="1.6" marker-start="url(#diamondAgg)" marker-end="url(#arrowNav)"/>
  <text x="213" y="276" font-size="10" font-weight="700" fill="#18181b">1</text>
  <text x="213" y="294" font-size="10" font-weight="700" fill="#18181b">0..*</text>

  <line x1="368" y1="340" x2="418" y2="215" stroke="#18181b" stroke-width="1.6" marker-end="url(#arrowNav)"/>
  <line x1="588" y1="296" x2="588" y2="330" stroke="#18181b" stroke-width="1.6" marker-start="url(#diamondComp)" marker-end="url(#arrowNav)"/>

  <!-- Decoupled Pub/Sub -->
  <line x1="758" y1="160" x2="808" y2="160" stroke="#dc4c3e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowEvt)"/>
  <text x="783" y="151" font-size="9.5" font-weight="700" fill="#dc4c3e" text-anchor="middle">&lt;&lt;event&gt;&gt;</text>

  <line x1="974" y1="240" x2="974" y2="214" stroke="#18181b" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowNav)"/>
  <text x="1025" y="231" font-size="9.5" font-weight="700" fill="#3f3f46" text-anchor="middle">&lt;&lt;implements&gt;&gt;</text>

  <line x1="368" y1="495" x2="418" y2="620" stroke="#18181b" stroke-width="1.5" marker-end="url(#arrowNav)"/>
  <path d="M 368 520 L 785 520 L 808 630" fill="none" stroke="#18181b" stroke-width="1.5" marker-end="url(#arrowNav)"/>
</svg>