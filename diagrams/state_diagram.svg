<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" width="100%" height="100%" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="stArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 9,5 0,9" fill="#18181b"/>
    </marker>
    <marker id="stCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0,1 9,5 0,9" fill="#dc4c3e"/>
    </marker>
  </defs>

  <rect width="1160" height="740" fill="#ffffff"/>
  <rect x="12" y="10" width="1136" height="720" rx="8" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>

  <rect x="12" y="10" width="1136" height="42" rx="8" fill="#18181b"/>
  <text x="32" y="36" fill="#ffffff" font-size="15" font-weight="700">UML State Machine Diagram — EventProposal Lifecycle &amp; Venue Lock Invariants</text>
  <text x="1128" y="36" fill="#a1a1aa" font-size="11.5" text-anchor="end">Synchronized States: ProposalState &lt;-&gt; SlotState</text>

  <circle cx="55" cy="160" r="11" fill="#18181b"/>
  <line x1="66" y1="160" x2="112" y2="160" stroke="#18181b" stroke-width="1.8" marker-end="url(#stArr)"/>
  <text x="89" y="150" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">create()</text>

  <!-- DRAFT -->
  <g transform="translate(115, 110)">
    <rect width="185" height="102" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
    <rect width="185" height="26" rx="10" fill="#18181b"/>
    <text x="92" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">DRAFT</text>
    <text x="10" y="44" font-size="10" fill="#18181b" font-family="monospace">entry / initProposalId()</text>
    <text x="10" y="60" font-size="10" fill="#18181b" font-family="monospace">do / editDetails &amp; Budget</text>
    <text x="10" y="76" font-size="10" fill="#52525b" font-family="monospace">venueLock = NONE</text>
    <text x="10" y="92" font-size="10" fill="#52525b" font-family="monospace">editableBy = ClubLeader</text>
  </g>

  <line x1="300" y1="160" x2="395" y2="160" stroke="#18181b" stroke-width="1.8" marker-end="url(#stArr)"/>
  <text x="348" y="143" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">submit()</text>
  <text x="348" y="155" font-size="9.5" fill="#52525b" text-anchor="middle">[noClash &amp; capOK]</text>

  <!-- Composite State -->
  <rect x="398" y="72" width="722" height="330" rx="12" fill="#f4f4f5" fill-opacity="0.7" stroke="#18181b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="415" y="93" fill="#18181b" font-size="11.5" font-weight="700">Composite State: ACTIVE_UNDER_REVIEW (Venue Slot = SOFT_HOLD | 72h SLA Timer Running)</text>

  <!-- PENDING_FACULTY -->
  <g transform="translate(420, 110)">
    <rect width="205" height="106" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="205" height="26" rx="8" fill="#27272a"/>
    <text x="102" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PENDING_FACULTY (Tier 1)</text>
    <text x="10" y="44" font-size="10" fill="#18181b" font-family="monospace">entry / placeSoftHold()</text>
    <text x="10" y="60" font-size="10" fill="#18181b" font-family="monospace">entry / notifyFaculty()</text>
    <text x="10" y="76" font-size="10" fill="#18181b" font-family="monospace">do / trackSlaTimer(24h)</text>
    <text x="10" y="92" font-size="10" fill="#52525b" font-family="monospace">exit / appendAuditHash()</text>
  </g>

  <line x1="625" y1="163" x2="735" y2="163" stroke="#18181b" stroke-width="1.8" marker-end="url(#stArr)"/>
  <text x="680" y="146" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">facultyApprove()</text>
  <text x="680" y="158" font-size="9.5" fill="#52525b" text-anchor="middle">[meritOK]</text>

  <!-- PENDING_DEAN -->
  <g transform="translate(738, 110)">
    <rect width="215" height="106" rx="8" fill="#ffffff" stroke="#dc4c3e" stroke-width="1.8"/>
    <rect width="215" height="26" rx="8" fill="#dc4c3e"/>
    <text x="107" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PENDING_DEAN (Tier 2)</text>
    <text x="10" y="44" font-size="10" fill="#18181b" font-family="monospace">entry / notifyDeanOffice()</text>
    <text x="10" y="60" font-size="10" fill="#18181b" font-family="monospace">do / verifyClubBudgetCap()</text>
    <text x="10" y="76" font-size="10" fill="#18181b" font-family="monospace">do / trackSlaTimer(48h)</text>
    <text x="10" y="92" font-size="10" fill="#dc4c3e" font-family="monospace">exit / earmarkSanction()</text>
  </g>

  <path d="M 845 216 L 845 274" fill="none" stroke="#18181b" stroke-width="1.8" marker-end="url(#stArr)"/>
  <text x="915" y="244" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">deanApprove()</text>
  <text x="915" y="256" font-size="9.5" fill="#52525b" text-anchor="middle">[budget &lt;= balance]</text>

  <!-- PENDING_SECURITY -->
  <g transform="translate(738, 278)">
    <rect width="215" height="106" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="215" height="26" rx="8" fill="#27272a"/>
    <text x="107" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">PENDING_SECURITY (Tier 3)</text>
    <text x="10" y="44" font-size="10" fill="#18181b" font-family="monospace">entry / alertSecurityDesk()</text>
    <text x="10" y="60" font-size="10" fill="#18181b" font-family="monospace">do / checkGuardAllocation()</text>
    <text x="10" y="76" font-size="10" fill="#18181b" font-family="monospace">do / trackSlaTimer(72h)</text>
    <text x="10" y="92" font-size="10" fill="#52525b" font-family="monospace">exit / issueGatePassQR()</text>
  </g>

  <!-- REVISION_REQUESTED -->
  <g transform="translate(115, 298)">
    <rect width="205" height="102" rx="10" fill="#ffffff" stroke="#3f3f46" stroke-width="1.8"/>
    <rect width="205" height="26" rx="10" fill="#52525b"/>
    <text x="102" y="18" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">REVISION_REQUESTED</text>
    <text x="10" y="44" font-size="10" fill="#18181b" font-family="monospace">entry / logReviewerNotes()</text>
    <text x="10" y="60" font-size="10" fill="#18181b" font-family="monospace">do / modifyBudgetOrSlot()</text>
    <text x="10" y="76" font-size="10" fill="#dc4c3e" font-family="monospace">venueLock = SOFT_HOLD (24h)</text>
    <text x="10" y="92" font-size="10" fill="#52525b" font-family="monospace">timeout(24h) -&gt; releaseHold</text>
  </g>

  <path d="M 522 216 L 522 330 L 323 330" fill="none" stroke="#dc4c3e" stroke-width="1.6" marker-end="url(#stCoral)"/>
  <text x="435" y="322" font-size="10" font-weight="700" fill="#dc4c3e" text-anchor="middle">requestChanges(comments)</text>

  <path d="M 217 298 L 217 255 L 455 255 L 455 219" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#stArr)"/>
  <text x="335" y="247" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">resubmitRevisedProposal()</text>

  <!-- APPROVED_AND_BOOKED -->
  <g transform="translate(738, 452)">
    <rect width="215" height="106" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="2.2"/>
    <rect width="215" height="26" rx="10" fill="#18181b"/>
    <text x="107" y="18" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">APPROVED_AND_BOOKED</text>
    <text x="10" y="44" font-size="10" fill="#18181b" font-family="monospace">entry / publishApprovedEvt()</text>
    <text x="10" y="60" font-size="10" fill="#18181b" font-family="monospace">entry / confirmVenueSlot()</text>
    <text x="10" y="76" font-size="10" fill="#18181b" font-family="monospace">do / allowExpenseLogging()</text>
    <text x="10" y="92" font-size="10" fill="#18181b" font-weight="700" font-family="monospace">venueLock = CONFIRMED</text>
  </g>

  <line x1="845" y1="384" x2="845" y2="449" stroke="#18181b" stroke-width="2" marker-end="url(#stArr)"/>
  <text x="920" y="424" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">securityGrantClearance()</text>

  <!-- COMPLETED_AND_SETTLED -->
  <g transform="translate(738, 608)">
    <rect width="215" height="102" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
    <rect width="215" height="26" rx="10" fill="#3f3f46"/>
    <text x="107" y="18" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">COMPLETED_AND_SETTLED</text>
    <text x="10" y="44" font-size="10" fill="#18181b" font-family="monospace">entry / issueQRBatchCerts()</text>
    <text x="10" y="60" font-size="10" fill="#18181b" font-family="monospace">entry / reconcileLedger()</text>
    <text x="10" y="76" font-size="10" fill="#18181b" font-family="monospace">exit / lockImmutableRecord()</text>
    <text x="10" y="92" font-size="10" fill="#52525b" font-family="monospace">venueLock = ARCHIVED</text>
  </g>

  <line x1="845" y1="558" x2="845" y2="605" stroke="#18181b" stroke-width="1.8" marker-end="url(#stArr)"/>
  <text x="955" y="586" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">eventConcluded() [receiptsOK]</text>

  <!-- REJECTED -->
  <g transform="translate(415, 468)">
    <rect width="205" height="96" rx="10" fill="#ffffff" stroke="#dc4c3e" stroke-width="2"/>
    <rect width="205" height="26" rx="10" fill="#dc4c3e"/>
    <text x="102" y="18" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">REJECTED</text>
    <text x="10" y="44" font-size="10" fill="#dc4c3e" font-family="monospace">entry / publishRejectedEvt()</text>
    <text x="10" y="60" font-size="10" fill="#dc4c3e" font-family="monospace">entry / releaseVenueHold()</text>
    <text x="10" y="76" font-size="10" fill="#dc4c3e" font-family="monospace">entry / unfreezeClubFunds()</text>
    <text x="10" y="90" font-size="10" fill="#52525b" font-family="monospace">venueLock = RELEASED</text>
  </g>

  <line x1="560" y1="402" x2="560" y2="465" stroke="#dc4c3e" stroke-width="1.8" marker-end="url(#stCoral)"/>
  <text x="635" y="438" font-size="10" font-weight="700" fill="#dc4c3e" text-anchor="middle">reject(reason) [any Tier]</text>

  <!-- CANCELLED -->
  <g transform="translate(115, 468)">
    <rect width="205" height="96" rx="10" fill="#ffffff" stroke="#52525b" stroke-width="2"/>
    <rect width="205" height="26" rx="10" fill="#52525b"/>
    <text x="102" y="18" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">CANCELLED</text>
    <text x="10" y="44" font-size="10" fill="#27272a" font-family="monospace">entry / releaseVenueHold()</text>
    <text x="10" y="60" font-size="10" fill="#27272a" font-family="monospace">entry / notifyStakeholders()</text>
    <text x="10" y="76" font-size="10" fill="#27272a" font-family="monospace">entry / logCancellation()</text>
    <text x="10" y="90" font-size="10" fill="#52525b" font-family="monospace">venueLock = RELEASED</text>
  </g>

  <line x1="217" y1="400" x2="217" y2="465" stroke="#dc4c3e" stroke-width="1.6" marker-end="url(#stCoral)"/>
  <text x="275" y="438" font-size="10" font-weight="600" fill="#dc4c3e" text-anchor="middle">withdraw() / [holdExpired]</text>

  <circle cx="517" cy="660" r="13" fill="none" stroke="#18181b" stroke-width="2.2"/>
  <circle cx="517" cy="660" r="7.5" fill="#18181b"/>
  <text x="517" y="688" font-size="10.5" font-weight="700" fill="#18181b" text-anchor="middle">Terminal State (Archived)</text>

  <path d="M 217 564 L 217 660 L 500 660" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#stArr)"/>
  <line x1="517" y1="564" x2="517" y2="643" stroke="#18181b" stroke-width="1.6" marker-end="url(#stArr)"/>
  <line x1="738" y1="660" x2="534" y2="660" stroke="#18181b" stroke-width="1.6" marker-end="url(#stArr)"/>
</svg>