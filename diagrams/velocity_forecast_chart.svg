<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" width="100%" height="100%" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1160" height="540" fill="#ffffff"/>
  <rect x="10" y="10" width="1140" height="520" rx="8" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>
  <rect x="10" y="10" width="1140" height="40" rx="8" fill="#18181b"/>
  <text x="28" y="35" fill="#ffffff" font-size="14.5" font-weight="700">Velocity Analysis &amp; Release Burndown Forecast (96 Story Points vs. 9-Month Window)</text>
  <text x="1130" y="35" fill="#a1a1aa" font-size="11.5" text-anchor="end">Observed Sprints 1–3: 11, 14, 13 SP | Mean Velocity = 12.67 SP/Sprint</text>

  <!-- Left Panel: Burndown -->
  <g transform="translate(24, 64)">
    <rect width="710" height="448" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.4"/>
    <text x="355" y="24" font-size="12.5" font-weight="700" fill="#18181b" text-anchor="middle">96-SP Product Backlog Burndown &amp; Velocity Cone (Sprints 0 to 11)</text>

    <!-- Grid: x=60..680, y=45..375 (330px = 100 SP -> 3.3px/SP) -->
    <!-- Y=0 -> 375, Y=20 -> 309, Y=40 -> 243, Y=60 -> 177, Y=80 -> 111, Y=96 -> 58.2 -->
    <g stroke="#e4e4e7" stroke-width="1">
      <line x1="60" y1="375" x2="680" y2="375" stroke="#18181b" stroke-width="1.5"/>
      <line x1="60" y1="309" x2="680" y2="309"/>
      <line x1="60" y1="243" x2="680" y2="243"/>
      <line x1="60" y1="177" x2="680" y2="177"/>
      <line x1="60" y1="111" x2="680" y2="111"/>
      <line x1="60" y1="58.2" x2="680" y2="58.2" stroke-dasharray="3,3"/>
      <line x1="60" y1="45" x2="60" y2="375" stroke="#18181b" stroke-width="1.5"/>
    </g>

    <g font-size="9.5" fill="#3f3f46" font-weight="600" text-anchor="end">
      <text x="52" y="379">0 SP</text>
      <text x="52" y="313">20 SP</text>
      <text x="52" y="247">40 SP</text>
      <text x="52" y="181">60 SP</text>
      <text x="52" y="115">80 SP</text>
      <text x="52" y="62" fill="#18181b" font-weight="700">96 SP</text>
    </g>

    <!-- X-axis Sprints: dx = 54px per sprint. Sp0=60, Sp1=114, Sp2=168, Sp3=222, Sp4=276, Sp5=330, Sp6=384, Sp7=438, Sp8=492, Sp9=546, Sp10=600, Sp11=654 -->
    <line x1="222" y1="45" x2="222" y2="375" stroke="#71717a" stroke-dasharray="4,3"/>
    <line x1="492" y1="45" x2="492" y2="375" stroke="#18181b" stroke-width="1.4" stroke-dasharray="5,3"/>
    <line x1="654" y1="45" x2="654" y2="375" stroke="#dc4c3e" stroke-width="1.6" stroke-dasharray="5,3"/>

    <g font-size="9" fill="#18181b" font-weight="600" text-anchor="middle">
      <text x="60" y="392">Sp 0</text><text x="60" y="403" fill="#71717a">(W0)</text>
      <text x="114" y="392">Sp 1</text><text x="114" y="403" fill="#71717a">(W2)</text>
      <text x="168" y="392">Sp 2</text><text x="168" y="403" fill="#71717a">(W4)</text>
      <text x="222" y="392" font-weight="700">Sp 3</text><text x="222" y="403" fill="#dc4c3e">(W6 Now)</text>
      <text x="276" y="392">Sp 4</text><text x="276" y="403" fill="#71717a">(W8)</text>
      <text x="330" y="392">Sp 5</text><text x="330" y="403" fill="#71717a">(W10)</text>
      <text x="384" y="392">Sp 6</text><text x="384" y="403" fill="#71717a">(W12)</text>
      <text x="438" y="392">Sp 7</text><text x="438" y="403" fill="#71717a">(W14)</text>
      <text x="492" y="392" font-weight="700">Sp 8</text><text x="492" y="403">(W16 Done)</text>
      <text x="546" y="392">Sp 9</text><text x="546" y="403" fill="#71717a">(W18)</text>
      <text x="654" y="392" fill="#dc4c3e" font-weight="700">Sp 11</text><text x="654" y="403" fill="#dc4c3e">(W22 Live)</text>
    </g>

    <!-- Cone of Uncertainty from Sp3 (222, 183.6) to Best Sp7.14 (445.7, 375) and Worst Sp8.27 (506.6, 375) -->
    <polygon points="222,183.6 445.7,375 506.6,375" fill="#e4e4e7" fill-opacity="0.7"/>
    <line x1="222" y1="183.6" x2="445.7" y2="375" stroke="#71717a" stroke-width="1.3" stroke-dasharray="4,3"/>
    <line x1="222" y1="183.6" x2="506.6" y2="375" stroke="#71717a" stroke-width="1.3" stroke-dasharray="4,3"/>

    <!-- Mean Forecast Line (12.67 SP/sp): Sp7.58 -> x = 222 + 4.579*54 = 469.3, y=375 -->
    <polyline points="222,183.6 276,225.4 330,267.2 384,309.0 438,350.8 469.3,375 492,375" fill="none" stroke="#dc4c3e" stroke-width="2.6" stroke-dasharray="7,4"/>

    <!-- Actual Line Sp0(60, 58.2) -> Sp1(114, 94.5) -> Sp2(168, 140.7) -> Sp3(222, 183.6) -->
    <polyline points="60,58.2 114,94.5 168,140.7 222,183.6" fill="none" stroke="#18181b" stroke-width="3.2"/>

    <circle cx="60" cy="58.2" r="4.5" fill="#18181b"/><text x="76" y="54" font-size="9.5" font-weight="700" fill="#18181b">96 SP</text>
    <circle cx="114" cy="94.5" r="4.5" fill="#18181b"/><text x="128" y="90" font-size="9.5" font-weight="700" fill="#18181b">85 (-11)</text>
    <circle cx="168" cy="140.7" r="4.5" fill="#18181b"/><text x="182" y="136" font-size="9.5" font-weight="700" fill="#18181b">71 (-14)</text>
    <circle cx="222" cy="183.6" r="5.5" fill="#dc4c3e"/><text x="234" y="179" font-size="10" font-weight="700" fill="#dc4c3e">58 SP Left (-13)</text>
    <circle cx="469.3" cy="375" r="5" fill="#dc4c3e"/>
    <circle cx="492" cy="375" r="5" fill="#18181b"/>

    <!-- Summary Box -->
    <rect x="330" y="74" width="330" height="78" rx="5" fill="#fafafa" stroke="#18181b" stroke-width="1.3"/>
    <text x="342" y="92" font-size="10.5" font-weight="700" fill="#18181b">Forecast Verdict (vs. 9-Month Graduation Window):</text>
    <text x="342" y="109" font-size="10" fill="#27272a">• Remaining: 58 / 12.67 = 4.58 Sprints -&gt; 5 Integer Sprints</text>
    <text x="342" y="125" font-size="10" fill="#27272a">• Total Dev: 8 Sprints = 16 Weeks (~3.7 Months)</text>
    <text x="342" y="141" font-size="10" font-weight="700" fill="#dc4c3e">• Plus 6w QA/Handover = 22w (Leaves 14–17w Buffer!)</text>

    <!-- Legend -->
    <line x1="70" y1="430" x2="100" y2="430" stroke="#18181b" stroke-width="3"/>
    <text x="108" y="434" font-size="9.5" font-weight="600" fill="#18181b">Actuals (Sp 1–3: 38 SP)</text>
    <line x1="255" y1="430" x2="285" y2="430" stroke="#dc4c3e" stroke-width="2.6" stroke-dasharray="6,3"/>
    <text x="293" y="434" font-size="9.5" font-weight="600" fill="#dc4c3e">Mean Forecast (12.67 SP/Sp)</text>
    <rect x="465" y="423" width="16" height="11" fill="#e4e4e7" stroke="#71717a"/>
    <text x="488" y="434" font-size="9.5" font-weight="600" fill="#3f3f46">Velocity Cone (11–14 SP/Sp)</text>
  </g>

  <!-- Right Panel: Velocity Bars + Baseline Metrics -->
  <g transform="translate(750, 64)">
    <rect width="386" height="230" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.4"/>
    <text x="193" y="24" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">Sprint Velocity Profile (SP / 2-Week Sprint)</text>
    <line x1="45" y1="185" x2="355" y2="185" stroke="#18181b" stroke-width="1.4"/>
    <line x1="45" y1="45" x2="45" y2="185" stroke="#18181b" stroke-width="1.4"/>

    <!-- Bars (9px per SP) -->
    <rect x="65" y="86" width="40" height="99" rx="3" fill="#18181b"/>
    <text x="85" y="80" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">11</text>
    <text x="85" y="200" font-size="9.5" font-weight="600" fill="#18181b" text-anchor="middle">Sp 1</text>

    <rect x="122" y="59" width="40" height="126" rx="3" fill="#18181b"/>
    <text x="142" y="53" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">14</text>
    <text x="142" y="200" font-size="9.5" font-weight="600" fill="#18181b" text-anchor="middle">Sp 2</text>

    <rect x="179" y="68" width="40" height="117" rx="3" fill="#18181b"/>
    <text x="199" y="62" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">13</text>
    <text x="199" y="200" font-size="9.5" font-weight="600" fill="#18181b" text-anchor="middle">Sp 3</text>

    <rect x="236" y="71" width="48" height="114" rx="3" fill="#dc4c3e"/>
    <text x="260" y="65" font-size="10" font-weight="700" fill="#dc4c3e" text-anchor="middle">12.67</text>
    <text x="260" y="200" font-size="9.5" font-weight="600" fill="#dc4c3e" text-anchor="middle">Sp 4–7</text>

    <rect x="302" y="119" width="40" height="66" rx="3" fill="#a1a1aa"/>
    <text x="322" y="113" font-size="10" font-weight="700" fill="#3f3f46" text-anchor="middle">7.33</text>
    <text x="322" y="200" font-size="9.5" font-weight="600" fill="#3f3f46" text-anchor="middle">Sp 8*</text>

    <line x1="45" y1="71" x2="355" y2="71" stroke="#dc4c3e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="200" y="218" font-size="9.5" font-weight="700" fill="#dc4c3e" text-anchor="middle">Mean Velocity v̄ = 38 / 3 = 12.67 SP/Sprint</text>
  </g>

  <g transform="translate(750, 306)">
    <rect width="386" height="206" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.4"/>
    <rect width="386" height="28" rx="6" fill="#18181b"/>
    <text x="193" y="19" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Baseline Operational Metrics Math</text>

    <rect x="14" y="40" width="358" height="72" rx="5" fill="#fafafa" stroke="#d4d4d8"/>
    <text x="24" y="57" font-size="10.5" font-weight="700" fill="#18181b">1. Approval Time Reduction (11 Days -&gt; 3 Days):</text>
    <text x="24" y="76" font-size="11" font-weight="700" fill="#dc4c3e" font-family="monospace">((11 - 3) / 11) × 100 = 72.73% Reduction</text>
    <text x="24" y="96" font-size="9.5" fill="#52525b">Saves 8.0 days/event (2,560 club-days/year across 320 events)</text>

    <rect x="14" y="122" width="358" height="72" rx="5" fill="#fafafa" stroke="#d4d4d8"/>
    <text x="24" y="139" font-size="10.5" font-weight="700" fill="#18181b">2. Venue Conflicts per Event (17 Clashes / 320 Events):</text>
    <text x="24" y="158" font-size="11" font-weight="700" fill="#dc4c3e" font-family="monospace">17 / 320 = 0.053125 Conflicts/Event (5.31%)</text>
    <text x="24" y="178" font-size="9.5" fill="#52525b">1 clash every 18.82 events -&gt; Target in ClubSphere: 0.00</text>
  </g>
</svg>