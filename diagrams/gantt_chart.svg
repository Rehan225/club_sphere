<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 470" width="100%" height="100%" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1050" height="470" fill="#ffffff"/>

  <!-- Title like HaulTrack Gantt -->
  <text x="615" y="24" font-size="13.5" font-weight="600" fill="#3f3f46" text-anchor="middle">ClubSphere - 36-week schedule (9-month graduation window; 22w active + 14w buffer)</text>

  <!-- Plot Area: x=260..980 (720px = 36 weeks -> 20px per week), y=55..415 -->
  <!-- Axes -->
  <line x1="260" y1="52" x2="260" y2="418" stroke="#3f3f46" stroke-width="1.2"/>
  <line x1="260" y1="418" x2="980" y2="418" stroke="#3f3f46" stroke-width="1.2"/>

  <!-- Vertical Grid Lines every 4 weeks (80px) -->
  <g stroke="#e4e4e7" stroke-width="1">
    <line x1="340" y1="52" x2="340" y2="418"/>
    <line x1="420" y1="52" x2="420" y2="418"/>
    <line x1="500" y1="52" x2="500" y2="418"/>
    <line x1="580" y1="52" x2="580" y2="418"/>
    <line x1="660" y1="52" x2="660" y2="418"/>
    <line x1="740" y1="52" x2="740" y2="418"/>
    <line x1="820" y1="52" x2="820" y2="418"/>
    <line x1="900" y1="52" x2="900" y2="418"/>
    <line x1="980" y1="52" x2="980" y2="418"/>
  </g>

  <!-- Milestone Vertical Dashed Lines (like HaulTrack M1..M4) -->
  <!-- M1: Week 2 (x=300), M2: Week 4 (x=340), M3: Week 11 (x=480), M4: Week 16 (x=580), M5: Week 19 (x=640), M6: Week 22 (x=700), Grad: Week 36 (x=980) -->
  <g stroke="#52525b" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="300" y1="42" x2="300" y2="418"/>
    <line x1="340" y1="36" x2="340" y2="418"/>
    <line x1="480" y1="42" x2="480" y2="418"/>
    <line x1="580" y1="36" x2="580" y2="418"/>
    <line x1="640" y1="42" x2="640" y2="418"/>
    <line x1="700" y1="36" x2="700" y2="418"/>
    <line x1="980" y1="36" x2="980" y2="418" stroke="#dc4c3e" stroke-width="1.6"/>
  </g>

  <g font-size="9" fill="#3f3f46" font-weight="600">
    <text x="303" y="58">M1 SRS signed</text>
    <text x="343" y="45">M2 Design frozen</text>
    <text x="483" y="58">M3 3-Tier workflow ready</text>
    <text x="583" y="45">M4 96 SP complete (Sp 8)</text>
    <text x="643" y="58">M5 Pilot UAT gate</text>
    <text x="703" y="45" fill="#18181b" font-weight="700">M6 Go-live &amp; handover</text>
    <text x="975" y="45" fill="#dc4c3e" font-weight="700" text-anchor="end">Grad Cutoff (W36)</text>
  </g>

  <!-- 12 Horizontal Task Bars (y starting at 72, step 28px) -->
  <!-- Coral (#dc4c3e) = Stakeholder-critical & Critical-Path gates; Black/Charcoal (#27272a) = Standard build items -->
  <g font-size="10" fill="#18181b" text-anchor="end">
    <text x="252" y="84">1 Scrum governance &amp; stakeholder sync</text>
    <text x="252" y="112">2 Elicitation &amp; IEEE 830 SRS ratification (M1)</text>
    <text x="252" y="140">3 UML design, DB schema &amp; RBAC auth (M2)</text>
    <text x="252" y="168">4 Venue calendar &amp; atomic soft-hold lock</text>
    <text x="252" y="196">5 3-tier approval engine (Fac/Dean/Sec) (M3)</text>
    <text x="252" y="224">6 Club budget ledger &amp; 7-day receipt gate</text>
    <text x="252" y="252">7 Bulk CSV &amp; QR certificate engine</text>
    <text x="252" y="280">8 Annual club leadership handover wizard</text>
    <text x="252" y="308">9 SHA-256 audit log &amp; 3-day SLA alerts (M4)</text>
    <text x="252" y="336">10 System QA: BVA &amp; decision table gate</text>
    <text x="252" y="364">11 46-club UAT pilot &amp; SLA verification (M5)</text>
    <text x="252" y="392">12 Go-live, KT bootcamp &amp; 14w shadow buffer</text>
  </g>

  <!-- Bars (x = 260 + startWk*20, width = durWk*20) -->
  <!-- 1: W0-W22 (x=260, w=440) Black -->
  <rect x="260" y="72" width="440" height="16" fill="#27272a"/>
  <!-- 2: W0-W2 (x=260, w=40) Coral (Stakeholder SRS gate) -->
  <rect x="260" y="100" width="40" height="16" fill="#dc4c3e"/>
  <!-- 3: W2-W4 (x=300, w=40) Black -->
  <rect x="300" y="128" width="40" height="16" fill="#27272a"/>
  <!-- 4: W4-W7 (x=340, w=60) Coral (Zero-clash auditorium gate) -->
  <rect x="340" y="156" width="60" height="16" fill="#dc4c3e"/>
  <!-- 5: W7-W11 (x=400, w=80) Coral (3-tier approval workflow) -->
  <rect x="400" y="184" width="80" height="16" fill="#dc4c3e"/>
  <!-- 6: W11-W14 (x=480, w=60) Black -->
  <rect x="480" y="212" width="60" height="16" fill="#27272a"/>
  <!-- 7: W7-W10 (x=400, w=60) Black -->
  <rect x="400" y="240" width="60" height="16" fill="#52525b"/>
  <!-- 8: W4-W7 (x=340, w=60) Black -->
  <rect x="340" y="268" width="60" height="16" fill="#52525b"/>
  <!-- 9: W14-W16 (x=540, w=40) Black -->
  <rect x="540" y="296" width="40" height="16" fill="#27272a"/>
  <!-- 10: W15-W18 (x=560, w=60) Coral (BVA & Decision Table gate) -->
  <rect x="560" y="324" width="60" height="16" fill="#dc4c3e"/>
  <!-- 11: W17-W19 (x=600, w=40) Coral (46-club pilot UAT) -->
  <rect x="600" y="352" width="40" height="16" fill="#dc4c3e"/>
  <!-- 12: W19-W22 active handover (x=640, w=60) Black + W22-W36 shadow buffer (x=700, w=280) hatched/light gray -->
  <rect x="640" y="380" width="60" height="16" fill="#18181b"/>
  <rect x="700" y="382" width="280" height="12" fill="#e4e4e7" stroke="#71717a" stroke-dasharray="4,2"/>
  <text x="840" y="391" font-size="9" font-weight="700" fill="#3f3f46" text-anchor="middle">14-Week Shadow Maintenance &amp; Exam Buffer</text>

  <!-- X-Axis Week Labels -->
  <g font-size="9.5" fill="#18181b" text-anchor="middle">
    <text x="260" y="434">W1</text>
    <text x="340" y="434">W5</text>
    <text x="420" y="434">W9</text>
    <text x="500" y="434">W13</text>
    <text x="580" y="434">W17</text>
    <text x="660" y="434">W21</text>
    <text x="740" y="434">W25</text>
    <text x="820" y="434">W29</text>
    <text x="900" y="434">W33</text>
    <text x="980" y="434" font-weight="700" fill="#dc4c3e">W36 (M9)</text>
  </g>
</svg>